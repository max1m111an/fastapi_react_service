services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend_main
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  frontend_main:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend_main
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    env_file:
      - .env
    volumes:
      - ./apps/frontend:/app/apps/frontend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
