services:
  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: Dockerfile
      target: fastapi
      args:
        APP_PORT: ${APP_PORT:-8080}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    env_file:
      - .env
    environment:
      DB_HOST: database
      DB_PORT: "3306"
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./database:/app/database
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('APP_PORT', '8080') + '/hello', timeout=3)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  database:
    container_name: database
    build:
      context: .
      dockerfile: Dockerfile
      target: database
    restart: always
    shm_size: 128mb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-12345}
      MARIADB_DATABASE: ${DB_NAME:-mydb}
      MARIADB_USER: ${DB_USER:-admin}
      MARIADB_PASSWORD: ${DB_PASS:-pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/dumps:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    container_name: adminer
    build:
      context: .
      dockerfile: Dockerfile
      target: adminer
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - app_network

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: always
    depends_on:
      fastapi:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  app_network:
    driver: bridge

volumes:
  mariadb_data:
