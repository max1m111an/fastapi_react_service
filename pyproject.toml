[project]
name = "fastapi-react-service"
version = "0.1.0"
description = "Template repo"
authors = [
    {name = "max1m111an",email = "maksimilianbegunov@inbox.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.147.0,<0.148.0)",
    "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "aiomysql (>=0.3.2,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false